name: Generate Daily Scripts & TTS Audio

on:
  schedule:
    # Runs every day at 02:30 UTC (8:00 AM IST / Morning Batch)
    - cron: '30 2 * * *'
  workflow_dispatch: # Keeps the manual "Run workflow" button active

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install google-genai edge-tts

      - name: Run script & Send Audio Email
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python daily_free_bot.py
